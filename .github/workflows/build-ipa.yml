# Build a signed DSH IPA on a macOS runner and upload it as an artifact.
# Signing uses the developer identity and profile stored as repo secrets
# (DEV_P12_B64, DEV_PROVISION_B64, P12_PASSWORD). The profile is a
# development profile for one iPad (UDID 00008103-000149C821DB001E) under
# bundle id app.jackfruit686.pisces8360, team T7N5A7X979. It carries the
# HealthKit entitlement but not Private Cloud Compute, so that entitlement
# is removed from app/DSH.entitlements before the build.
name: Build signed IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          ls /Applications | grep -i xcode || true
          XCODE27=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE27" ]; then
            echo "Selecting $XCODE27"
            sudo xcode-select -s "$XCODE27/Contents/Developer"
          fi
          xcodebuild -version
          node --version
          npm --version

      - name: Install build tools
        run: |
          brew install meson ninja lld libarchive
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document

      - name: Cache emulator and rootfs
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            ish-arm64/build-arm64-release
            build/root.tar.gz
          key: dsh-v1-${{ hashFiles('ish-arm64/**', 'rootfs/staging/package.json', 'rootfs/staging/package-lock.json', 'scripts/build-rootfs.sh', 'Makefile') }}

      - name: Build emulator
        if: steps.build-cache.outputs.cache-hit != 'true'
        env:
          CFLAGS: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
          CXXFLAGS: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
        run: |
          make emulator
          ninja -C ish-arm64/build-arm64-release tools/fakefsify
          ls -lh ish-arm64/build-arm64-release/ish ish-arm64/build-arm64-release/tools/fakefsify

      - name: Build guest rootfs
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          # The emulator copies the host hostname into a 65-byte guest field;
          # the runner hostname is longer than that and aborts the emulator.
          sudo hostname ish
          sudo scutil --set HostName ish || true
          hostname
          make rootfs

      - name: Regenerate Xcode project
        run: make project

      - name: Match entitlements to profile
        run: |
          # The dev profile carries HealthKit but not Private Cloud Compute.
          # (plutil splits key paths on dots, so use PlistBuddy for this key.)
          if /usr/libexec/PlistBuddy -c "Print :com.apple.developer.private-cloud-compute" app/DSH.entitlements >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.private-cloud-compute" app/DSH.entitlements
          fi
          cat app/DSH.entitlements

      - name: Install signing identity
        env:
          P12_B64: ${{ secrets.DEV_P12_B64 }}
          PROVISION_B64: ${{ secrets.DEV_PROVISION_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 --decode > /tmp/dev.p12
          echo "$PROVISION_B64" | base64 --decode > /tmp/dev.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/df707424-2028-4b30-b1ef-6c5049742c0c.mobileprovision
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/dev.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -s build.keychain
          security find-identity -v -p codesigning build.keychain
          rm /tmp/dev.p12 /tmp/dev.mobileprovision

      - name: Build signed app
        run: |
          xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Developer: Created via API (K4WFUF47X2)" \
            PROVISIONING_PROFILE_SPECIFIER="00008103-000149C821DB001EI3K892_dev" \
            PRODUCT_BUNDLE_IDENTIFIER=app.jackfruit686.pisces8360 \
            DSH_DEVELOPMENT_TEAM=T7N5A7X979 \
            build
          ls -lh build/Release-iphoneos/DSH.app 2>/dev/null || ls -lh ~/Library/Developer/Xcode/DerivedData/DSH-*/Build/Products/Release-iphoneos/DSH.app

      - name: Package IPA
        run: |
          APP=$(ls -dt build/Release-iphoneos/DSH.app ~/Library/Developer/Xcode/DerivedData/DSH-*/Build/Products/Release-iphoneos/DSH.app 2>/dev/null | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r -y DSH-signed.ipa Payload
          unzip -l DSH-signed.ipa
          ls -lh DSH-signed.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-signed-ipa
          path: DSH-signed.ipa
          if-no-files-found: error
